name: Release

on:
  push:
    branches:
      - main
    paths:
      - .changeset/**
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write # Required for OIDC
  issues: read
  pull-requests: write

env:
  NODE_VERSION: 22

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.repository == 'capawesome-team/capacitor-sqlite-drivers'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0

        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Update npm for OIDC trusted publishing
        run: |
          # npm trusted publishing requires npm >= 11.5.1
          # Node.js 20.x ships with npm 10.x, so we need to update
          echo "Current npm version: $(npm --version)"
          npm install -g npm@latest
          echo "Updated npm version: $(npm --version)"
      - name: Set npm access token for GitHub registry
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.NPM_TOKEN }}" >> .npmrc
      - name: Install Dependencies
        run: npm ci
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0

        with:
          publish: npm run release
          commit: "chore(release): publish"
          title: "chore(release): publish"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
